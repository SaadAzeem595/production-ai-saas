<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NourishBot</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --card: #171a21;
    --text: #e8eaed;
    --muted: #9aa1ac;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border-radius: 16px;
    padding: 40px 36px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(74, 222, 128, 0.35);
    border-radius: 999px;
    padding: 4px 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
  }
  p {
    color: var(--muted);
    line-height: 1.6;
    margin: 0;
    font-size: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Static placeholder</span>
    <h1>NourishBot runs elsewhere</h1>
    <p>
      This application is a Python service (FastAPI + Gradio) that's built and
      deployed as a container to Azure Container Apps, not to Netlify. This
      page exists only so the connected Netlify site has something to
      publish successfully.
    </p>
  </div>
</body>
</html>
