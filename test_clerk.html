<!DOCTYPE html>
<html>
<head>
    <title>Test Clerk</title>
    <script 
        async 
        crossorigin="anonymous" 
        data-clerk-publishable-key="pk_test_aW5zcGlyZWQtaGFtc3Rlci0xMi5jbGVyay5hY2NvdW50cy5kZXYk" 
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@4/dist/clerk.browser.js" 
        type="text/javascript">
    </script>
</head>
<body>
    <h1>Testing Clerk Initialization</h1>
    <div id="output">Initializing...</div>
    <div id="clerk-sign-in-mount"></div>

    <script>
        const publishableKey = "pk_test_aW5zcGlyZWQtaGFtc3Rlci0xMi5jbGVyay5hY2NvdW50cy5kZXYk";
        
        async function init() {
            const output = document.getElementById('output');
            output.innerHTML = "Waiting for window.Clerk...";
            
            let checkClerkInterval = setInterval(async () => {
                if (window.Clerk && window.Clerk.load) {
                    clearInterval(checkClerkInterval);
                    output.innerHTML += "<br>window.Clerk found! Type: " + typeof window.Clerk;
                    
                    try {
                        output.innerHTML += "<br>Attempting: await window.Clerk.load();";
                        await window.Clerk.load();
                        output.innerHTML += "<br>window.Clerk.load() succeeded! User: " + (window.Clerk.user ? window.Clerk.user.id : "none");
                        
                        if (!window.Clerk.user) {
                            output.innerHTML += "<br>Mounting Sign-In...";
                            window.Clerk.mountSignIn(document.getElementById('clerk-sign-in-mount'));
                        }
                    } catch (e) {
                        output.innerHTML += "<br><span style='color: red;'>Error during load: " + e.message + "</span>";
                    }
                }
            }, 100);
        }
        
        window.addEventListener('load', init);
    </script>
</body>
</html>
